<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ምዝገባ - የዩኒቨርሲቲ መጽሐፍት ቤት</title>
    <style>
        /* ያለ ኢንተርኔት የሚሰራ ኦፍላይን ዲዛይን */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            background: #ffffff;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            margin: 0 20px;
        }
        .text-center { text-align: center; }
        .text-primary { color: #0d6efd; }
        .mb-4 { margin-bottom: 24px; }
        .mb-3 { margin-bottom: 15px; }
        .form-label {
            display: block;
            margin-bottom: 6px;
            color: #555555;
            font-size: 14px;
            font-weight: 600;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .form-control:focus { border-color: #0d6efd; }
        .btn-primary {
            width: 100%;
            background-color: #198754; /* አረንጓዴ ቀለም ለምዝገባ */
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-primary:hover { background-color: #157347; }
        .alert {
            padding: 10px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 13px;
        }
        .link-text {
            display: block;
            margin-top: 15px;
            font-size: 14px;
            color: #0d6efd;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="register-card">
    <h3 class="text-center text-primary mb-4">📝 አዲስ ተማሪ መመዝገቢያ</h3>
    
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert text-center">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/register" method="POST">
        <div class="mb-3">
            <label class="form-label">ሙሉ ስም</label>
            <input type="text" name="full_name" class="form-control" placeholder="ሙሉ ስምዎን ይጻፉ..." required>
        </div>
        <div class="mb-3">
            <label class="form-label">የተጠቃሚ ስም (Username)</label>
            <input type="text" name="username" class="form-control" placeholder="username..." required>
        </div>
        <div class="mb-3">
            <label class="form-label">ኢሜይል (Email)</label>
            <input type="email" name="email" class="form-control" placeholder="email@univ.edu.et..." required>
        </div>
        <div class="mb-3">
            <label class="form-label">የይለፍ ቃል (Password)</label>
            <input type="password" name="password" class="form-control" placeholder="በጣም ጠንካራ የሚስጥር ቃል..." required>
        </div>
        
        <button type="submit" class="btn btn-primary">አካውንት ፍጠር (Register)</button>
    </form>
    
    <div class="text-center">
        <a href="/login" class="link-text">አስቀድመው አካውንት አሎት? እዚህ ይግቡ</a>
    </div>
</div>

</body>
</html>
