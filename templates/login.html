<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>መግቢያ - የዩኒቨርሲቲ መጽሐፍት ቤት</title>
    <style>
        /* ያለ ኢንተርኔት የሚሰራ ሙሉ የራሳችን የዲዛይን ኮድ (Offline Styling) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f4f6f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            background: #ffffff;
            padding: 35px 30px;
            width: 100%;
            max-width: 380px;
            margin: 0 20px;
        }
        .text-center {
            text-align: center;
        }
        .text-primary {
            color: #0d6efd;
        }
        .mb-4 {
            margin-bottom: 24px;
        }
        .mb-3 {
            margin-bottom: 18px;
        }
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #555555;
            font-size: 14px;
            font-weight: 600;
        }
        .form-control, .form-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
        }
        .btn-primary {
            width: 100%;
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        .alert {
            padding: 10px;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .register-link {
            display: block;
            margin-top: 18px;
            color: #0d6efd;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .register-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center text-primary mb-4">🔐 የሲስተም መግቢያ</h3>
    
    <!-- የማስጠንቀቂያ መልእክቶች ማሳያ -->
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert text-center">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
        <!-- ሚና መምረጫ -->
        <div class="mb-3">
            <label class="form-label">የመግቢያ ሚና (Role)</label>
            <select name="role" class="form-select">
                <option value="student">ተማሪ (Student)</option>
                <option value="admin">አስተዳዳሪ (Admin)</option>
            </select>
        </div>
        
        <!-- የተጠቃሚ ስም -->
        <div class="mb-3">
            <label class="form-label">የተጠቃሚ ስም</label>
            <input type="text" name="username" class="form-control" placeholder="username..." required>
        </div>
        
        <!-- የይለፍ ቃል -->
        <div class="mb-3">
            <label class="form-label">የይለፍ ቃል</label>
            <input type="password" name="password" class="form-control" placeholder="password..." required>
        </div>
        
        <!-- መግቢያ ቁልፍ -->
        <button type="submit" class="btn btn-primary">ግባ (Login)</button>
    </form>

    <!-- አዲስ፦ ወደ መመዝገቢያ ገጽ የሚወስድ ሊንክ -->
    <div class="text-center">
        <a href="/register" class="register-link">አዲስ ተማሪ ነዎት? እዚህ ይመዝገቡ 📝</a>
    </div>
</div>

</body>
</html>
